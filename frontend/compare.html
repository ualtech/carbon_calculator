<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comparador · CarbonAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green: #00ff88; --lime: #aaff00; --teal: #00e5cc;
      --orange: #ff6b2b; --dark: #0a0f0a; --card: #111a11;
      --card2: #0d1a0d; --border: #1e3a1e; --text: #e8f5e8; --muted: #7a9e7a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--dark); color:var(--text); font-family:'Syne',sans-serif; min-height:100vh; }
    body::before {
      content:''; position:fixed; inset:0;
      background-image: linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px);
      background-size:40px 40px; pointer-events:none; z-index:0;
    }
    nav {
      position:fixed; top:0; left:0; right:0; z-index:100;
      display:flex; align-items:center; justify-content:space-between;
      padding:1.2rem 2.5rem; background:rgba(10,15,10,0.85);
      backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
    }
    .logo { font-size:1.1rem; font-weight:800; letter-spacing:0.08em; color:var(--green); text-decoration:none; }
    .logo span { color:var(--orange); }
    nav ul { list-style:none; display:flex; gap:2rem; }
    nav ul a { color:var(--muted); text-decoration:none; font-size:0.85rem; letter-spacing:0.06em; font-weight:700; transition:color 0.2s; }
    nav ul a:hover, nav ul a.active { color:var(--teal); }

    .page { position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:7rem 2rem 4rem; }

    .page-badge {
      display:inline-block; background:rgba(0,229,204,0.1); border:1px solid rgba(0,229,204,0.3);
      color:var(--teal); font-family:'Space Mono',monospace; font-size:0.7rem;
      letter-spacing:0.12em; padding:0.3rem 0.8rem; border-radius:999px; margin-bottom:1rem;
    }
    h1 { font-size:2.8rem; font-weight:800; letter-spacing:-0.02em; line-height:1.1; margin-bottom:0.5rem; }
    h1 span { color:var(--teal); }
    .subtitle { color:var(--muted); font-size:0.95rem; line-height:1.6; margin-bottom:2.5rem; }

    .compare-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;
      animation:fadeUp 0.5s 0.1s ease both;
    }
    @media(max-width:640px) { .compare-grid { grid-template-columns:1fr; } }

    .panel {
      background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.8rem;
    }
    .panel-s1 { border-top:3px solid var(--green); }
    .panel-s2 { border-top:3px solid var(--teal); }

    .panel-title {
      font-size:0.75rem; letter-spacing:0.12em; font-family:'Space Mono',monospace;
      font-weight:700; margin-bottom:1.4rem;
    }
    .panel-s1 .panel-title { color:var(--green); }
    .panel-s2 .panel-title { color:var(--teal); }

    .field { margin-bottom:1.1rem; }
    label { display:block; font-size:0.8rem; color:var(--muted); margin-bottom:0.4rem; letter-spacing:0.05em; }
    input, select {
      width:100%; background:var(--card2); border:1px solid var(--border);
      border-radius:8px; padding:0.7rem 1rem; color:var(--text);
      font-family:'Space Mono',monospace; font-size:0.82rem; outline:none;
      transition:border-color 0.2s; -webkit-appearance:none;
    }
    input:focus, select:focus { border-color:var(--green); }
    select option { background:#111a11; }

    .btn-area { grid-column:1/-1; display:flex; justify-content:center; margin-top:0.5rem; }
    .btn {
      background:var(--teal); color:var(--dark); border:none; border-radius:10px;
      padding:1rem 3rem; font-family:'Syne',sans-serif; font-size:0.9rem;
      font-weight:800; letter-spacing:0.05em; cursor:pointer;
      transition:transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,229,204,0.3); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }

    /* Results */
    #resultsArea { grid-column:1/-1; }

    .diff-banner {
      background:linear-gradient(135deg,rgba(0,229,204,0.1),rgba(0,255,136,0.07));
      border:1px solid rgba(0,229,204,0.25); border-radius:14px;
      padding:1.5rem 2rem; margin-bottom:1.5rem;
      display:flex; align-items:center; justify-content:space-around; flex-wrap:wrap; gap:1rem;
      animation:fadeUp 0.4s ease both;
    }
    .diff-item { text-align:center; }
    .diff-val { font-family:'Space Mono',monospace; font-size:2rem; font-weight:700; }
    .diff-val.positive { color:var(--green); }
    .diff-val.negative { color:var(--orange); }
    .diff-val.neutral { color:var(--teal); }
    .diff-label { font-size:0.72rem; color:var(--muted); letter-spacing:0.08em; margin-top:0.2rem; }

    .result-row {
      display:grid; grid-template-columns:1fr 1fr; gap:1rem;
      animation:fadeUp 0.4s 0.1s ease both;
    }
    @media(max-width:540px) { .result-row { grid-template-columns:1fr; } }

    .result-card {
      background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.4rem;
    }
    .result-card.s1 { border-left:3px solid var(--green); }
    .result-card.s2 { border-left:3px solid var(--teal); }

    .rc-title { font-size:0.72rem; letter-spacing:0.1em; font-family:'Space Mono',monospace; font-weight:700; margin-bottom:1rem; }
    .s1 .rc-title { color:var(--green); }
    .s2 .rc-title { color:var(--teal); }

    .rc-val { font-family:'Space Mono',monospace; font-size:1.6rem; font-weight:700; color:var(--text); }
    .rc-sub { font-size:0.75rem; color:var(--muted); margin-top:0.2rem; }

    .equiv-mini { display:flex; flex-direction:column; gap:0.4rem; margin-top:1rem; }
    .equiv-row { display:flex; justify-content:space-between; font-size:0.78rem; }
    .equiv-row span:first-child { color:var(--muted); }
    .equiv-row span:last-child { color:var(--lime); font-family:'Space Mono',monospace; }

    .error-box { background:rgba(255,107,43,0.1); border:1px solid rgba(255,107,43,0.3); border-radius:10px; padding:1rem 1.5rem; color:var(--orange); font-size:0.85rem; }
    .loading { text-align:center; color:var(--muted); font-family:'Space Mono',monospace; font-size:0.85rem; padding:2rem; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .orb { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; }
    .orb1 { width:300px; height:300px; background:rgba(0,229,204,0.06); top:-60px; right:-60px; }
    .orb2 { width:250px; height:250px; background:rgba(0,255,136,0.05); bottom:80px; left:40px; }
      .api-error { display:none; margin:1rem 0; padding:0.8rem 1rem; border:1px solid #e74c3c; border-radius:8px; color:#e74c3c; font-size:0.85rem; }
    .api-error.show { display:block; }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <nav>
    <a class="logo" href="index.html">CARBON<span>AI</span></a>
    <ul>
      <li><a href="calculate.html" data-i18n="nav_calc">Calcular</a></li>
      <li><a href="compare.html" class="active" data-i18n="nav_cmp">Comparar</a></li>
      <li><a href="simulate.html" data-i18n="nav_sim">Simular</a></li>
    </ul>
  </nav>

  <div class="page">
    <div style="animation:fadeUp 0.5s ease both; margin-bottom:2rem;">
      <div class="page-badge" data-i18n="cmp_badge">⚖️ COMPARADOR</div>
      <h1 data-i18n-html="cmp_h1">Compara dos <span>escenarios</span></h1>
      <p class="subtitle" data-i18n="cmp_sub">¿GPT-5 o Gemini? ¿España o Europa? Descubre qué combinación emite menos CO₂.</p>
    </div>

    <div class="compare-grid">
      <!-- Scenario 1 -->
      <div class="panel panel-s1">
        <div id="apiError" class="api-error" role="alert"></div>
        <div class="panel-title" data-i18n="p_s1">// ESCENARIO 1</div>
        <div class="field"><label data-i18n="l_model_s">MODELO</label><select id="s1_model"></select></div>
        <div class="field"><label data-i18n="l_region">REGIÓN</label><select id="s1_region"></select></div>
        <div class="field"><label data-i18n="l_task_s">TIPO DE TAREA</label><select id="s1_task" onchange="applyTaskType(this.value, 's1_tin', 's1_tout')"><option value="" data-i18n="opt_manual_s">— Tokens manuales —</option></select></div>
        <div class="field"><label data-i18n="l_tin_s">TOKENS ENTRADA</label><input type="number" id="s1_tin" placeholder="1000" min="0"/></div>
        <div class="field"><label data-i18n="l_tout_s">TOKENS SALIDA</label><input type="number" id="s1_tout" placeholder="500" min="0"/></div>
      </div>

      <!-- Scenario 2 -->
      <div class="panel panel-s2">
        <div class="panel-title" data-i18n="p_s2">// ESCENARIO 2</div>
        <div class="field"><label data-i18n="l_model_s">MODELO</label><select id="s2_model"></select></div>
        <div class="field"><label data-i18n="l_region">REGIÓN</label><select id="s2_region"></select></div>
        <div class="field"><label data-i18n="l_task_s">TIPO DE TAREA</label><select id="s2_task" onchange="applyTaskType(this.value, 's2_tin', 's2_tout')"><option value="" data-i18n="opt_manual_s">— Tokens manuales —</option></select></div>
        <div class="field"><label data-i18n="l_tin_s">TOKENS ENTRADA</label><input type="number" id="s2_tin" placeholder="1000" min="0"/></div>
        <div class="field"><label data-i18n="l_tout_s">TOKENS SALIDA</label><input type="number" id="s2_tout" placeholder="500" min="0"/></div>
      </div>

      <div class="btn-area">
        <button class="btn" id="cmpBtn" onclick="doCompare()" data-i18n="btn_cmp">COMPARAR ESCENARIOS</button>
      </div>

      <div id="resultsArea"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const API = window.CC_API || "http://localhost:8000";
    function showApiError(e) {
      const box = document.getElementById("apiError");
      if (box) {
        box.textContent = "No se pudo conectar con la API en " + API + " (" + (e && e.message ? e.message : e) + "). " +
          "Comprueba la URL en frontend/config.js y que el backend esté en marcha. / Could not reach the API at " + API + ".";
        box.classList.add("show");
      }
      console.error("API error:", e);
    }
    async function getJson(path) {
      const r = await fetch(`${API}${path}`);
      if (!r.ok) throw new Error(`HTTP ${r.status} en ${path}`);
      return r.json();
    }

    let TASK_TYPES = [], MODELS = [], REGIONS = [];

    function fillSelect(id, items, valueOf, labelOf, keepFirst) {
      const sel = document.getElementById(id);
      const current = sel.value;
      const first = keepFirst ? sel.options[0] : null;
      sel.innerHTML = "";
      if (first) sel.appendChild(first);
      items.forEach(it => {
        const o = document.createElement("option");
        o.value = valueOf(it); o.textContent = labelOf(it);
        if (it.descripcion) o.title = it.descripcion;
        sel.appendChild(o);
      });
      if (current) sel.value = current;
    }

    function relabel() {
      ["s1_model","s2_model"].forEach(id => fillSelect(id, MODELS, m => m.id_modelo, m => `${tModel(m.nombre_modelo)} (${m.proveedor})`));
      ["s1_region","s2_region"].forEach(id => fillSelect(id, REGIONS, r => r.nombre_region, r => tRegion(r.nombre_region)));
      ["s1_task","s2_task"].forEach(id => fillSelect(id, TASK_TYPES, x => x.tipo,
        x => `${tTask(x.tipo, x.etiqueta)} · ${x.tokens_entrada + x.tokens_salida} ${t("tokens_word")}`, true));
    }
    window.onLangChange = relabel;
    function applyTaskType(tipo, inId, outId) {
      const t = TASK_TYPES.find(x => x.tipo === tipo);
      if (!t) return;
      document.getElementById(inId).value = t.tokens_entrada;
      document.getElementById(outId).value = t.tokens_salida;
    }

    async function loadSelects() {
      try {
        [MODELS, REGIONS] = await Promise.all([getJson("/models"), getJson("/regions")]);
        try { TASK_TYPES = await getJson("/task_types"); }
        catch (e) { TASK_TYPES = []; console.warn("Sin tipos de tarea:", e.message); }
        relabel();
      } catch(e) { showApiError(e); }
    }

    async function doCompare() {
      const btn = document.getElementById("cmpBtn");
      const area = document.getElementById("resultsArea");
      btn.disabled = true;
      area.innerHTML = `<div class="loading">${t("loading_cmp")}</div>`;

      const body = {
        scenario1: {
          model_id: parseInt(document.getElementById("s1_model").value),
          region: document.getElementById("s1_region").value,
          tokens_input: parseInt(document.getElementById("s1_tin").value)||0,
          tokens_output: parseInt(document.getElementById("s1_tout").value)||0
        },
        scenario2: {
          model_id: parseInt(document.getElementById("s2_model").value),
          region: document.getElementById("s2_region").value,
          tokens_input: parseInt(document.getElementById("s2_tin").value)||0,
          tokens_output: parseInt(document.getElementById("s2_tout").value)||0
        }
      };

      try {
        const res = await fetch(`${API}/compare`, {
          method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail||"Error");
        renderCompare(data);
      } catch(e) {
        area.innerHTML = `<div class="error-box">⚠️ ${e.message}</div>`;
      } finally { btn.disabled = false; }
    }

    function renderCompare(data) {
      const diff = data.difference;
      const diffClass = diff.co2_kg > 0 ? "negative" : diff.co2_kg < 0 ? "positive" : "neutral";
      const diffSign = diff.co2_kg > 0 ? "+" : "";
      const winner = diff.co2_kg > 0 ? t("win2") : diff.co2_kg < 0 ? t("win1") : t("tie");

      const equivHTML = (eq) => Object.entries(eq).map(([k,v]) =>
        `<div class="equiv-row"><span>${tEquiv(k)}</span><span>${v}</span></div>`
      ).join("");

      document.getElementById("resultsArea").innerHTML = `
        <div class="diff-banner">
          <div class="diff-item">
            <div class="diff-val ${diffClass}">${diffSign}${diff.co2_kg} kg</div>
            <div class="diff-label">${t("d_co2")}</div>
          </div>
          <div class="diff-item">
            <div class="diff-val neutral">${diff.percentage}%</div>
            <div class="diff-label">${t("d_pct")}</div>
          </div>
          <div class="diff-item">
            <div class="diff-val neutral" style="font-size:1.2rem">${winner}</div>
            <div class="diff-label">${t("d_res")}</div>
          </div>
        </div>

        <div class="result-row">
          <div class="result-card s1">
            <div class="rc-title">${t("p_s1")}</div>
            <div class="rc-val">${data.scenario1.co2_kg} kg CO₂</div>
            <div class="rc-sub">${data.scenario1.kwh} kWh · ${data.scenario1.tokens_total.toLocaleString()} tokens</div>
            <div class="equiv-mini">${equivHTML(data.scenario1.equivalences)}</div>
          </div>
          <div class="result-card s2">
            <div class="rc-title">${t("p_s2")}</div>
            <div class="rc-val">${data.scenario2.co2_kg} kg CO₂</div>
            <div class="rc-sub">${data.scenario2.kwh} kWh · ${data.scenario2.tokens_total.toLocaleString()} tokens</div>
            <div class="equiv-mini">${equivHTML(data.scenario2.equivalences)}</div>
          </div>
        </div>
      `;
    }

    loadSelects();
  </script>
  <script src="i18n.js"></script>
</body>
</html>
