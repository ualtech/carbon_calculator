<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de Aula · CarbonAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green:#00ff88; --lime:#aaff00; --teal:#00e5cc;
      --orange:#ff6b2b; --dark:#0a0f0a; --card:#111a11;
      --card2:#0d1a0d; --border:#1e3a1e; --text:#e8f5e8; --muted:#7a9e7a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--dark); color:var(--text); font-family:'Syne',sans-serif; min-height:100vh; }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px);
      background-size:40px 40px; pointer-events:none; z-index:0;
    }
    nav {
      position:fixed; top:0; left:0; right:0; z-index:100;
      display:flex; align-items:center; justify-content:space-between;
      padding:1.2rem 2.5rem; background:rgba(10,15,10,0.85);
      backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
    }
    .logo { font-size:1.1rem; font-weight:800; letter-spacing:0.08em; color:var(--green); text-decoration:none; }
    .logo span { color:var(--orange); }
    nav ul { list-style:none; display:flex; gap:2rem; }
    nav ul a { color:var(--muted); text-decoration:none; font-size:0.85rem; letter-spacing:0.06em; font-weight:700; transition:color 0.2s; }
    nav ul a:hover { color:var(--orange); }
    nav ul a.active { color:var(--orange); }

    .page { position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:7rem 2rem 4rem; }

    .page-badge {
      display:inline-block; background:rgba(255,107,43,0.1); border:1px solid rgba(255,107,43,0.3);
      color:var(--orange); font-family:'Space Mono',monospace; font-size:0.7rem;
      letter-spacing:0.12em; padding:0.3rem 0.8rem; border-radius:999px; margin-bottom:1rem;
    }
    h1 { font-size:2.8rem; font-weight:800; letter-spacing:-0.02em; line-height:1.1; margin-bottom:0.5rem; }
    h1 span { color:var(--orange); }
    .subtitle { color:var(--muted); font-size:0.95rem; line-height:1.6; margin-bottom:2.5rem; }

    /* Global config */
    .global-panel {
      background:var(--card); border:1px solid var(--border); border-top:3px solid var(--orange);
      border-radius:16px; padding:1.8rem; margin-bottom:1.5rem;
      display:grid; grid-template-columns:1fr 1fr; gap:1.2rem;
      animation:fadeUp 0.4s ease both;
    }
    @media(max-width:540px) { .global-panel { grid-template-columns:1fr; } }

    .panel-title {
      font-size:0.75rem; letter-spacing:0.12em; color:var(--orange);
      font-family:'Space Mono',monospace; font-weight:700;
      grid-column:1/-1; margin-bottom:0.3rem;
    }

    label { display:block; font-size:0.8rem; color:var(--muted); margin-bottom:0.4rem; letter-spacing:0.05em; }
    input, select {
      width:100%; background:var(--card2); border:1px solid var(--border);
      border-radius:8px; padding:0.7rem 1rem; color:var(--text);
      font-family:'Space Mono',monospace; font-size:0.82rem; outline:none;
      transition:border-color 0.2s; -webkit-appearance:none;
    }
    input:focus, select:focus { border-color:var(--orange); }
    select option { background:#111a11; }

    /* Activities */
    .activities-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:1rem; animation:fadeUp 0.4s 0.1s ease both;
    }
    .activities-header h2 { font-size:1rem; font-weight:800; letter-spacing:0.04em; }
    .btn-add {
      background:transparent; border:1px solid var(--orange); color:var(--orange);
      border-radius:8px; padding:0.5rem 1.2rem;
      font-family:'Space Mono',monospace; font-size:0.75rem; font-weight:700;
      cursor:pointer; transition:background 0.2s, color 0.2s;
    }
    .btn-add:hover { background:var(--orange); color:var(--dark); }

    #activitiesList { display:flex; flex-direction:column; gap:1rem; margin-bottom:1.5rem; }

    .activity-card {
      background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.4rem;
      position:relative; animation:fadeUp 0.3s ease both;
    }

    .activity-card-grid {
      display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:1rem; align-items:end;
    }
    @media(max-width:640px) { .activity-card-grid { grid-template-columns:1fr 1fr; } }

    .btn-remove {
      position:absolute; top:1rem; right:1rem;
      background:transparent; border:1px solid rgba(255,107,43,0.3); color:var(--orange);
      border-radius:6px; padding:0.3rem 0.6rem; font-size:0.75rem; cursor:pointer;
      transition:background 0.2s; font-family:'Space Mono',monospace;
    }
    .btn-remove:hover { background:rgba(255,107,43,0.15); }

    .act-num {
      position:absolute; top:-10px; left:1.2rem;
      background:var(--orange); color:var(--dark); border-radius:4px;
      padding:0.15rem 0.5rem; font-size:0.65rem; font-weight:800;
      font-family:'Space Mono',monospace; letter-spacing:0.05em;
    }

    .btn-simulate {
      width:100%; background:var(--orange); color:var(--dark); border:none; border-radius:10px;
      padding:1rem; font-family:'Syne',sans-serif; font-size:0.9rem; font-weight:800;
      letter-spacing:0.05em; cursor:pointer; transition:transform 0.2s,box-shadow 0.2s;
      animation:fadeUp 0.4s 0.2s ease both;
    }
    .btn-simulate:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,107,43,0.3); }
    .btn-simulate:disabled { opacity:0.5; cursor:not-allowed; }

    /* Results */
    .results-area { margin-top:2rem; }

    .summary-banner {
      background:linear-gradient(135deg,rgba(255,107,43,0.1),rgba(170,255,0,0.06));
      border:1px solid rgba(255,107,43,0.25); border-radius:16px;
      padding:1.8rem 2rem; display:grid; grid-template-columns:repeat(3,1fr); gap:1rem;
      margin-bottom:1.5rem; animation:fadeUp 0.4s ease both;
    }
    @media(max-width:540px) { .summary-banner { grid-template-columns:1fr; } }

    .sum-item { text-align:center; }
    .sum-val { font-family:'Space Mono',monospace; font-size:2rem; font-weight:700; color:var(--orange); letter-spacing:-0.02em; }
    .sum-label { font-size:0.72rem; color:var(--muted); letter-spacing:0.08em; margin-top:0.3rem; }

    .equiv-section { margin-bottom:1.5rem; animation:fadeUp 0.4s 0.1s ease both; }
    .section-title { font-size:0.72rem; letter-spacing:0.1em; color:var(--muted); font-family:'Space Mono',monospace; font-weight:700; margin-bottom:0.8rem; }
    .equiv-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:0.7rem; }
    .equiv-item { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:0.9rem; text-align:center; }
    .equiv-val { font-family:'Space Mono',monospace; font-size:1.05rem; color:var(--lime); font-weight:700; }
    .equiv-label { font-size:0.7rem; color:var(--muted); margin-top:0.2rem; line-height:1.4; }

    .breakdown-title { font-size:0.72rem; letter-spacing:0.1em; color:var(--muted); font-family:'Space Mono',monospace; font-weight:700; margin-bottom:0.8rem; }
    .breakdown-list { display:flex; flex-direction:column; gap:0.6rem; animation:fadeUp 0.4s 0.15s ease both; }
    .bk-item {
      background:var(--card); border:1px solid var(--border); border-radius:10px;
      padding:1rem 1.2rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.5rem;
    }
    .bk-name { font-weight:700; font-size:0.9rem; }
    .bk-stats { display:flex; gap:1.5rem; }
    .bk-stat { text-align:right; }
    .bk-stat-val { font-family:'Space Mono',monospace; font-size:0.85rem; color:var(--orange); }
    .bk-stat-label { font-size:0.68rem; color:var(--muted); }

    .error-box { background:rgba(255,107,43,0.1); border:1px solid rgba(255,107,43,0.3); border-radius:10px; padding:1rem 1.5rem; color:var(--orange); font-size:0.85rem; }
    .loading { text-align:center; color:var(--muted); font-family:'Space Mono',monospace; font-size:0.85rem; padding:2rem; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .orb { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; }
    .orb1 { width:350px; height:350px; background:rgba(255,107,43,0.06); top:-80px; right:-80px; }
    .orb2 { width:250px; height:250px; background:rgba(0,255,136,0.04); bottom:80px; left:40px; }
      .api-error { display:none; margin:1rem 0; padding:0.8rem 1rem; border:1px solid #e74c3c; border-radius:8px; color:#e74c3c; font-size:0.85rem; }
    .api-error.show { display:block; }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <nav>
    <a class="logo" href="index.html">CARBON<span>AI</span></a>
    <ul>
      <li><a href="calculate.html" data-i18n="nav_calc">Calcular</a></li>
      <li><a href="compare.html" data-i18n="nav_cmp">Comparar</a></li>
      <li><a href="simulate.html" class="active" data-i18n="nav_sim">Simular</a></li>
    </ul>
  </nav>

  <div class="page">
    <div style="animation:fadeUp 0.5s ease both; margin-bottom:2rem;">
      <div class="page-badge" data-i18n="sim_badge">🏫 SIMULADOR DE AULA</div>
      <h1 data-i18n-html="sim_h1">Simula el impacto <span>colectivo</span></h1>
      <p class="subtitle" data-i18n="sim_sub">Define el número de estudiantes, las actividades con IA y la duración. Descubre el CO₂ total del aula.</p>
    </div>

    <!-- Config global -->
    <div class="global-panel">
      <div id="apiError" class="api-error" role="alert"></div>
        <div class="panel-title" data-i18n="p_general">// CONFIGURACIÓN GENERAL</div>
      <div>
        <label data-i18n="l_students">Nº DE ESTUDIANTES</label>
        <input type="number" id="num_students" placeholder="ej: 30" data-i18n-ph="ph_students" min="1"/>
      </div>
      <div>
        <label data-i18n="l_region">REGIÓN</label>
        <select id="region"></select>
      </div>
    </div>

    <!-- Activities -->
    <div class="activities-header">
      <h2 data-i18n="h_acts">ACTIVIDADES</h2>
      <button class="btn-add" onclick="addActivity()" data-i18n="btn_add">+ AÑADIR ACTIVIDAD</button>
    </div>

    <div id="activitiesList"></div>

    <button class="btn-simulate" id="simBtn" onclick="doSimulate()" data-i18n="btn_sim">SIMULAR IMPACTO DEL AULA</button>

    <div id="resultsArea" class="results-area"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const API = window.CC_API || "http://localhost:8000";
    function showApiError(e) {
      const box = document.getElementById("apiError");
      if (box) {
        box.textContent = "No se pudo conectar con la API en " + API + " (" + (e && e.message ? e.message : e) + "). " +
          "Comprueba la URL en frontend/config.js y que el backend esté en marcha. / Could not reach the API at " + API + ".";
        box.classList.add("show");
      }
      console.error("API error:", e);
    }
    async function getJson(path) {
      const r = await fetch(`${API}${path}`);
      if (!r.ok) throw new Error(`HTTP ${r.status} en ${path}`);
      return r.json();
    }

    let models = [], regions = [];
    let activityCount = 0;

    function relabel() {
      const rs = document.getElementById("region");
      const cur = rs.value; rs.innerHTML = "";
      regions.forEach(r => {
        const o = document.createElement("option");
        o.value = r.nombre_region; o.textContent = tRegion(r.nombre_region);
        rs.appendChild(o);
      });
      if (cur) rs.value = cur;
      // relabel model options and static labels inside existing activity cards
      document.querySelectorAll(".activity-card select[id$='_model'] option").forEach(o => {
        const m = models.find(x => String(x.id_modelo) === o.value);
        if (m) o.textContent = `${tModel(m.nombre_modelo)} (${m.proveedor})`;
      });
      document.querySelectorAll(".activity-card [data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
      document.querySelectorAll(".activity-card [data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
    }
    window.onLangChange = relabel;

    async function loadData() {
      try {
        [models, regions] = await Promise.all([getJson("/models"), getJson("/regions")]);
        relabel();
      } catch(e) { showApiError(e); }

      addActivity(); // default first activity
    }

    function addActivity() {
      activityCount++;
      const id = activityCount;
      const div = document.createElement("div");
      div.className = "activity-card";
      div.id = `act_${id}`;

      const modelOptions = models.map(m =>
        `<option value="${m.id_modelo}">${tModel(m.nombre_modelo)} (${m.proveedor})</option>`
      ).join("");

      div.innerHTML = `
        <div class="act-num">${t("act_prefix")} ${id}</div>
        <button class="btn-remove" onclick="removeActivity(${id})">✕</button>
        <div class="activity-card-grid">
          <div>
            <label data-i18n="l_act_name">${t("l_act_name")}</label>
            <input type="text" id="act_${id}_name" placeholder="${t("ph_act_name")}" data-i18n-ph="ph_act_name"/>
          </div>
          <div>
            <label data-i18n="l_model_s">${t("l_model_s")}</label>
            <select id="act_${id}_model">${modelOptions}</select>
          </div>
          <div>
            <label data-i18n="l_tokens_student">${t("l_tokens_student")}</label>
            <input type="number" id="act_${id}_tokens" placeholder="500" min="0"/>
          </div>
          <div>
            <label data-i18n="l_freq">${t("l_freq")}</label>
            <select id="act_${id}_freq">
              <option value="daily" data-i18n="f_daily">${t("f_daily")}</option>
              <option value="weekly" selected data-i18n="f_weekly">${t("f_weekly")}</option>
              <option value="monthly" data-i18n="f_monthly">${t("f_monthly")}</option>
            </select>
          </div>
          <div>
            <label data-i18n="l_weeks">${t("l_weeks")}</label>
            <input type="number" id="act_${id}_weeks" placeholder="10" min="1" value="10"/>
          </div>
        </div>
      `;
      document.getElementById("activitiesList").appendChild(div);
    }

    function removeActivity(id) {
      const el = document.getElementById(`act_${id}`);
      if (el) el.remove();
    }

    async function doSimulate() {
      const btn = document.getElementById("simBtn");
      const area = document.getElementById("resultsArea");
      btn.disabled = true;
      area.innerHTML = `<div class="loading">${t("loading_sim")}</div>`;

      const activities = [];
      document.querySelectorAll(".activity-card").forEach(card => {
        const idMatch = card.id.match(/act_(\d+)/);
        if (!idMatch) return;
        const i = idMatch[1];
        activities.push({
          name: document.getElementById(`act_${i}_name`).value || `${t("act_default")} ${i}`,
          model_id: parseInt(document.getElementById(`act_${i}_model`).value),
          tokens_per_student: parseInt(document.getElementById(`act_${i}_tokens`).value)||0,
          frequency: document.getElementById(`act_${i}_freq`).value,
          weeks: parseInt(document.getElementById(`act_${i}_weeks`).value)||1
        });
      });

      const body = {
        num_students: parseInt(document.getElementById("num_students").value)||1,
        region: document.getElementById("region").value,
        activities
      };

      try {
        const res = await fetch(`${API}/simulate`, {
          method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail||"Error");
        renderSimulate(data, body.num_students);
      } catch(e) {
        area.innerHTML = `<div class="error-box">⚠️ ${e.message}</div>`;
      } finally { btn.disabled = false; }
    }

    function renderSimulate(data, numStudents) {
      const equivHTML = Object.entries(data.equivalences).map(([k,v]) => `
        <div class="equiv-item">
          <div class="equiv-val">${v}</div>
          <div class="equiv-label">${tEquiv(k)}</div>
        </div>
      `).join("");

      const breakdownHTML = data.breakdown_by_activity.map(act => `
        <div class="bk-item">
          <div class="bk-name">${act.activity}</div>
          <div class="bk-stats">
            <div class="bk-stat">
              <div class="bk-stat-val">${act.co2_kg} kg</div>
              <div class="bk-stat-label">${t("bk_co2")}</div>
            </div>
            <div class="bk-stat">
              <div class="bk-stat-val">${act.tokens_total.toLocaleString()}</div>
              <div class="bk-stat-label">${t("bk_tokens")}</div>
            </div>
          </div>
        </div>
      `).join("");

      document.getElementById("resultsArea").innerHTML = `
        <div class="summary-banner">
          <div class="sum-item">
            <div class="sum-val">${data.total_co2_kg}</div>
            <div class="sum-label">${t("s_kg_total")}</div>
          </div>
          <div class="sum-item">
            <div class="sum-val">${data.per_student_co2_kg}</div>
            <div class="sum-label">${t("s_kg_student")}</div>
          </div>
          <div class="sum-item">
            <div class="sum-val">${numStudents}</div>
            <div class="sum-label">${t("s_students")}</div>
          </div>
        </div>

        <div class="equiv-section">
          <div class="section-title">${t("s_equiv_total")}</div>
          <div class="equiv-grid">${equivHTML}</div>
        </div>

        <div class="breakdown-title">${t("s_breakdown")}</div>
        <div class="breakdown-list">${breakdownHTML}</div>
      `;
    }

    loadData();
  </script>
  <script src="i18n.js"></script>
</body>
</html>
